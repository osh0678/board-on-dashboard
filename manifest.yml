modules:
  jira:dashboardGadget:
    - key: board-on-dashboard-gadget
      title: Board on Dashboard
      description: View your Jira board directly on your dashboard. Read-only, fast, no setup.
      thumbnail: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      render: native
      resource: main
      resolver:
        function: resolver
      edit:
        render: native
        resource: edit

  function:
    - key: resolver
      handler: index.handler

resources:
  - key: main
    path: src/frontend/view.jsx
  - key: edit
    path: src/frontend/edit.jsx

app:
  runtime:
    name: nodejs22.x
  id: "ari:cloud:ecosystem::app/CHANGE-ME-AFTER-forge-register"

permissions:
  scopes:
    - read:jira-work
    - read:board-scope:jira-software
    - read:issue-details:jira
    - read:sprint:jira-software
