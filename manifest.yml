modules:
  jira:dashboardGadget:
    - key: board-on-dashboard-gadget
      title: "Kanban Board & Wallboard"
      description: "Embed a Scrum or Kanban board on your Jira dashboard. Read-only wallboard view, no setup."
      thumbnail: https://raw.githubusercontent.com/osh0678/jira-board-gadget/main/assets/icon.svg
      render: native
      resource: main
      resolver:
        function: resolver
      edit:
        render: native
        resource: edit

  function:
    - key: resolver
      handler: resolvers/index.handler

resources:
  - key: main
    path: src/frontend/view.jsx
  - key: edit
    path: src/frontend/edit.jsx

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/ff668621-d4b8-4b0e-89a0-2ed34d31baf6

permissions:
  scopes:
    - read:project:jira
    - read:board-scope.admin:jira-software
    - read:jira-work
    - read:board-scope:jira-software
    - read:issue-details:jira
    - read:sprint:jira-software
